<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chambre Froide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: control-panel shell. Sidebar of zones/actions on desktop, scrolling tab strip on phones; a controller-style temperature readout in the header. */
:root{
  --bg:#eef2f5; --panel:#ffffff; --panel-2:#f5f8fa; --line:#d5dde4; --line-2:#e6ecf0;
  --fg:#14222d; --muted:#5a6b78; --faint:#8696a2;
  --accent:#0f5f8c; --accent-fg:#ffffff; --accent-soft:#dcebf4;
  --ok:#1d7a4c; --ok-soft:#dff2e7; --warn:#a15c00; --warn-soft:#fbeed6; --bad:#b42318; --bad-soft:#fbe3e0;
  --lcd-bg:#0d1a24; --lcd-fg:#7fd3ff;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b141b; --panel:#121e27; --panel-2:#16242f; --line:#24343f; --line-2:#1c2a34;
  --fg:#e3ecf2; --muted:#9db0bd; --faint:#6f8492;
  --accent:#5fb4e6; --accent-fg:#06202f; --accent-soft:#163246;
  --ok:#5cc98d; --ok-soft:#14301f; --warn:#f0b04d; --warn-soft:#33260f; --bad:#ff7a6b; --bad-soft:#3a1714;
  --lcd-bg:#050c11; --lcd-fg:#7fd3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b141b; --panel:#121e27; --panel-2:#16242f; --line:#24343f; --line-2:#1c2a34;
  --fg:#e3ecf2; --muted:#9db0bd; --faint:#6f8492;
  --accent:#5fb4e6; --accent-fg:#06202f; --accent-soft:#163246;
  --ok:#5cc98d; --ok-soft:#14301f; --warn:#f0b04d; --warn-soft:#33260f; --bad:#ff7a6b; --bad-soft:#3a1714;
  --lcd-bg:#050c11; --lcd-fg:#7fd3ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--fg);font-weight:500}
.nav a:hover{background:var(--panel-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{font-size:11px;font-family:var(--f-mono);background:var(--bad);color:#fff;border-radius:10px;padding:0 7px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:0 10px;margin-top:6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{min-width:0;padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.lcds{display:flex;flex-wrap:wrap;gap:8px}
.lcd{background:var(--lcd-bg);color:var(--lcd-fg);border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;min-width:118px;border:1px solid transparent}
.lcd small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8aa4b5}
.lcd b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;line-height:1.2}
.lcd.alarm{border-color:#ff6b5b}.lcd.alarm b{color:#ff8d80}
.lcd.warn b{color:#ffc56b}
.lcd.stale b{color:#8aa4b5}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h p{margin:0;color:var(--muted);font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12px}
.lead{margin:0;color:var(--muted);max-width:68ch}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;border-left:4px solid var(--warn);background:var(--warn-soft)}
.alert.bad{border-color:var(--bad);background:var(--bad-soft)}
.alert.ok{border-color:var(--ok);background:var(--ok-soft)}
.alert.info{border-color:var(--accent);background:var(--accent-soft)}
.alert b{display:block}
.alert div{min-width:0}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
.tw table{min-width:520px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--panel-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num,td .num{white-space:nowrap}
tr.first td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);width:100%;min-width:0;font-size:14px}
input[type=checkbox]{width:auto}
.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg);font-weight:400}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 90px 110px 110px 36px;gap:8px;align-items:end}
.total{font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.timer{font-family:var(--f-mono);font-size:2.2rem;font-weight:500;letter-spacing:.02em}
.timer.warn{color:var(--warn)} .timer.bad{color:var(--bad)}
.label-card{border:1.5px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px;background:var(--panel-2)}
.label-card b{font-family:var(--f-display);font-size:1rem}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(5,12,18,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:var(--r);border:1px solid var(--line);padding:18px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.checklist{display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:10px}
  .brand span,.nav-label,.side-foot{display:none}
  .brand b{font-size:1.05rem;white-space:nowrap}
  .nav{flex-direction:row;gap:2px}
  .nav a{white-space:nowrap;padding:6px 10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .line .rm{justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .side,.topbar,.no-print{display:none!important}
  .shell{display:block} main{padding:0}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>Chambre Froide</b><span>Frozen stock · wholesale &amp; retail</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="storeNote"></div>
  </aside>
  <main id="main"><div class="loading">Opening the cold room records…</div></main>
</div>
<div id="overlay"></div>
<script>
"use strict";
/* ============================================================
   Chambre Froide — cold room management
   Data lives either in the artifact's shared database (when the
   page runs as a claude.ai artifact) or in this browser's
   localStorage (when opened as a plain web page).
   ============================================================ */

const COLS = ["products","zones","batches","sales","moves","temps","events","checks","settings"];
const LS_KEY = "chambre-froide-v1";
const S = {}; COLS.forEach(c => S[c] = {});
let backend = null;          // {kind, put(col,doc), del(col,id)}
let ready = false;
const draft = { sale:null, fraction:null, tempZone:null, stockZone:"", stockQ:"", saleChannel:"wholesale" };

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();
const list = col => Object.values(S[col]);
const settings = () => Object.assign({ currency:"", staleHours:4, expiryWarnDays:30, fractionWarnMin:15, fractionMaxMin:30, maxOutageHours:4, business:"" }, S.settings.main || {});
const num = (v, d=2) => { const n = Number(v); return isFinite(n) ? n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:d}) : "–"; };
const money = v => { const c = settings().currency; const t = Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); return c ? `${t} ${h(c)}` : t; };
const temp = v => (v==null||v==="") ? "–" : (Number(v) > 0 ? "+" : "") + Number(v).toFixed(1).replace("-", "−") + " °C";
const toF = c => (c*9/5+32);
const dt = iso => iso ? new Date(iso).toLocaleString(undefined,{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "–";
const dOnly = iso => iso ? new Date(iso.length===10 ? iso+"T12:00:00" : iso).toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"}) : "–";
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
const localInput = d => { const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); };
const dur = ms => { const m = Math.max(0,Math.round(ms/60000)); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; };
const daysTo = date => Math.floor((new Date(date+"T23:59:59") - new Date())/86400000);
const product = id => S.products[id] || { name:"(deleted product)", cartonKg:0, packKg:0 };
const zone = id => S.zones[id] || { name:"(deleted zone)", type:"walkin" };
const formName = (f, n=2) => f==="carton" ? (n===1?"carton":"cartons") : (n===1?"pack":"packs");
const sortBy = (arr, f) => arr.sort((a,b) => { const x=f(a), y=f(b); return x<y?-1:x>y?1:0; });

/* ---------- storage ---------- */
function put(col, doc){ S[col][doc.id] = doc; backend.put(col, doc); }
function del(col, id){ delete S[col][id]; backend.del(col, id); }

function localBackend(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw){ const d = JSON.parse(raw); COLS.forEach(c => S[c] = d[c] || {}); } } catch(e){}
  let t = null;
  const save = () => { clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ toast("Could not save on this device: storage is full or blocked."); } }, 150); };
  return { kind:"local", put: save, del: save };
}

async function dbBackend(db){
  const writeQ = new Map();
  const be = {
    kind:"db",
    put(col, doc){ db.collection(col).doc(doc.id).set(JSON.parse(JSON.stringify(doc))).catch(e => toast(dbErr(e))); },
    del(col, id){ db.collection(col).doc(id).delete().catch(e => toast(dbErr(e))); }
  };
  await new Promise(resolve => {
    let pending = COLS.length, done = false;
    const finish = () => { if (!done){ done = true; resolve(); } };
    const timer = setTimeout(finish, 10000);
    COLS.forEach(col => {
      let first = true;
      let q = db.collection(col);
      if (col === "temps") q = q.orderBy("at","desc").limit(1000);
      if (col === "moves") q = q.orderBy("at","desc").limit(500);
      q.onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { const v = d.data(); if (v) m[d.id] = Object.assign({id:d.id}, v); });
        S[col] = m;
        if (first){ first = false; if (--pending === 0){ clearTimeout(timer); finish(); } }
        if (ready) scheduleRender();
      }, err => { if (first){ first = false; if (--pending === 0){ clearTimeout(timer); finish(); } } toast(dbErr(err)); });
    });
  });
  return be;
}
function dbErr(e){
  const c = e && e.code;
  if (c === "not_granted") return "You can view these records but not change them. Ask the owner for edit access.";
  if (c === "quota_exceeded") return "The cold room database is full. Export a backup and delete old temperature readings.";
  return "Could not save: " + (e && e.message || "unknown error");
}

async function boot(){
  let db = null;
  if (window.claude && typeof window.claude.use === "function"){
    try { db = await Promise.race([window.claude.use("db"), new Promise(r => setTimeout(() => r(null), 10000))]); } catch(e){ db = null; }
  }
  if (db){ backend = await dbBackend(db); }
  else { backend = localBackend(); }
  $("#storeNote").innerHTML = backend.kind === "db"
    ? "Records are shared with everyone who opens this page."
    : "Records are saved in this browser only. Export a backup regularly (Setup).";
  ready = true;
  render();
  setInterval(tick, 1000);
  setInterval(() => { if (!isTyping()) render(); }, 60000);
}

/* ---------- domain: stock ---------- */
function liveBatches(){ return list("batches").filter(b => b.qty > 0); }
function stockQty(productId, form, zoneIds){
  return liveBatches().filter(b => b.productId===productId && b.form===form && (!zoneIds || zoneIds.includes(b.zoneId))).reduce((s,b)=>s+b.qty,0);
}
function fifoOrder(arr){ return arr.sort((a,b) => (a.receivedAt||"").localeCompare(b.receivedAt||"") || (a.expiry||"").localeCompare(b.expiry||"")); }
function fifoPick(productId, form, zoneIds, qty){
  const pool = fifoOrder(liveBatches().filter(b => b.productId===productId && b.form===form && (!zoneIds || zoneIds.includes(b.zoneId))));
  const alloc = []; let need = qty;
  for (const b of pool){ if (need <= 0) break; const take = Math.min(b.qty, need); alloc.push({ batchId:b.id, qty:take, lot:b.lot, zoneId:b.zoneId }); need -= take; }
  return need > 0 ? null : alloc;
}
function applyAlloc(alloc){ alloc.forEach(a => { const b = S.batches[a.batchId]; put("batches", Object.assign({}, b, { qty: +(b.qty - a.qty).toFixed(3) })); }); }
function logMove(type, summary, data={}){ put("moves", { id:uid("mv"), at:nowIso(), type, summary, data }); }
function stockValue(){
  return liveBatches().reduce((s,b) => { const p = product(b.productId); const price = b.form==="carton" ? (p.wholesalePrice||0) : (p.retailPrice||0); return s + b.qty*price; }, 0);
}
function zonesOf(type){ return list("zones").filter(z => z.type===type).map(z => z.id); }

/* ---------- domain: temperature ---------- */
function latestTemp(zoneId){
  let best = null; for (const t of list("temps")) if (t.zoneId===zoneId && (!best || t.at > best.at)) best = t; return best;
}
function tempStatus(z, t){
  if (!t) return { cls:"stale", label:"No reading", pill:"" };
  const st = settings();
  const ageH = (Date.now() - new Date(t.at)) / 3600000;
  if (ageH > st.staleHours) return { cls:"stale", label:`Last reading ${dur(Date.now()-new Date(t.at))} ago`, pill:"warn" };
  if (t.value > z.max + 3) return { cls:"alarm", label:"Critical: too warm", pill:"bad" };
  if (t.value > z.max) return { cls:"warn", label:"Alarm: above limit", pill:"bad" };
  if (t.value < z.min) return { cls:"warn", label:"Colder than needed", pill:"info" };
  return { cls:"ok", label:"In range", pill:"ok" };
}
function openEvents(){ return list("events").filter(e => !e.end); }

function alerts(){
  const out = []; const st = settings();
  for (const z of sortBy(list("zones"), z => z.order||0)){
    const t = latestTemp(z.id), s = tempStatus(z, t);
    if (!t) out.push({ lvl:"warn", title:`${z.name}: no temperature recorded yet`, body:"Log a reading in Temperatures.", go:"temps" });
    else if (s.cls==="alarm" || s.cls==="warn" && s.pill==="bad") out.push({ lvl:"bad", title:`${z.name} at ${temp(t.value)} (limit ${temp(z.max)})`, body:`${s.label}. Keep the door shut, check the evaporator fans and the condensing unit, and move stock to another freezer if it keeps rising.`, go:"temps" });
    else if (s.cls==="stale") out.push({ lvl:"warn", title:`${z.name}: ${s.label.toLowerCase()}`, body:`Readings are expected at least every ${st.staleHours} h to prove the cold chain during inspections.`, go:"temps" });
  }
  for (const e of openEvents()){
    const ms = Date.now() - new Date(e.start);
    if (e.kind==="power"){
      const lvl = (!e.generator && ms/3600000 >= st.maxOutageHours/2) ? "bad" : "warn";
      out.push({ lvl, title:`Power cut in progress for ${dur(ms)}${e.generator ? " (generator running)" : ""}`, body: e.generator ? "Check generator fuel. Keep doors shut." : `No backup power recorded. Keep doors shut; stock is at risk after about ${st.maxOutageHours} h.`, go:"events" });
    } else if (e.kind==="defrost" && ms > 45*60000){
      out.push({ lvl:"warn", title:`Defrost running for ${dur(ms)}`, body:"A defrost cycle normally lasts 20–40 min. Check the controller.", go:"events" });
    } else if (e.kind==="door" && ms > 5*60000){
      out.push({ lvl:"warn", title:`Door open for ${dur(ms)}`, body:"Warm air is entering the room. Close it as soon as loading is done.", go:"events" });
    } else if (e.kind==="breakdown"){
      out.push({ lvl:"bad", title:`Breakdown open: ${e.note||"refrigeration fault"}`, body:`Started ${dt(e.start)}. Watch temperatures closely.`, go:"events" });
    }
  }
  const expired = liveBatches().filter(b => b.expiry && daysTo(b.expiry) < 0);
  if (expired.length) out.push({ lvl:"bad", title:`${expired.length} expired batch${expired.length>1?"es":""} still in stock`, body:"Remove them from sale and write them off.", go:"stock" });
  const soon = liveBatches().filter(b => b.expiry && daysTo(b.expiry) >= 0 && daysTo(b.expiry) <= st.expiryWarnDays);
  if (soon.length) out.push({ lvl:"warn", title:`${soon.length} batch${soon.length>1?"es":""} expire within ${st.expiryWarnDays} days`, body:"Sell these first.", go:"stock" });
  for (const p of list("products")){
    if (p.minCartons && stockQty(p.id,"carton") < p.minCartons) out.push({ lvl:"warn", title:`Low stock: ${p.name}`, body:`${stockQty(p.id,"carton")} cartons left (reorder level ${p.minCartons}).`, go:"stock" });
  }
  return out;
}

/* ---------- rendering ---------- */
const VIEWS = [
  ["overview","Overview"],["stock","Stock"],["receive","Receive"],["fraction","Repack"],["sell","Sell"],
  ["temps","Temperatures"],["events","Power & defrost"],["setup","Setup"]
];
let lastView = null;
function currentView(){ const v = (location.hash||"").slice(1); return VIEWS.some(x=>x[0]===v) ? v : "overview"; }

function isTyping(){ const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && $("#main").contains(a); }
let renderPending = false;
function scheduleRender(){ if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); }

function render(){
  if (!ready) return;
  const v = currentView();
  const al = alerts();
  const bad = al.filter(a => a.lvl==="bad").length;
  $("#nav").innerHTML = VIEWS.map(([id,label]) => `<a href="#${id}" class="${id===v?"on":""}">${label}${id==="overview"&&bad?`<span class="badge">${bad}</span>`:""}</a>`).join("");
  // keep what the person was typing across live updates
  const keep = {}; let focusId = null, sel = null;
  if (lastView === v){
    $$("#main input[id],#main select[id],#main textarea[id]").forEach(el => { keep[el.id] = el.type==="checkbox" ? el.checked : el.value; });
    const a = document.activeElement; if (a && a.id && $("#main").contains(a)){ focusId = a.id; try { sel = [a.selectionStart, a.selectionEnd]; } catch(e){} }
  }
  const html = ({overview:vOverview, stock:vStock, receive:vReceive, fraction:vFraction, sell:vSell, temps:vTemps, events:vEvents, setup:vSetup})[v]();
  $("#main").innerHTML = topbar() + html;
  if (lastView === v){
    for (const [id,val] of Object.entries(keep)){ const el = document.getElementById(id); if (el && !el.dataset.fresh){ if (el.type==="checkbox") el.checked = val; else el.value = val; } }
    if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { if (sel && sel[0]!=null) el.setSelectionRange(sel[0], sel[1]); } catch(e){} } }
  }
  if (lastView !== v) window.scrollTo(0,0);
  lastView = v;
  afterRender(v);
}

function expiryPill(b){
  if (!b.expiry) return `<span class="muted">–</span>`;
  const d = daysTo(b.expiry);
  if (d < 0) return `<span class="pill bad">Expired ${dOnly(b.expiry)}</span>`;
  if (d <= settings().expiryWarnDays) return `<span class="pill warn">${dOnly(b.expiry)} · ${d} d</span>`;
  return `<span class="small">${dOnly(b.expiry)}</span>`;
}

/* ----- temperature chart (SVG, one scale for everything) ----- */
function tempChart(z, hours, height, width){
  const W = width || 600, H = height || 160, padL = 40, padR = 8, padT = 8, padB = 18;
  const t1 = Date.now(), t0 = t1 - hours*3600000;
  const pts = list("temps").filter(t => t.zoneId===z.id && new Date(t.at) >= t0).sort((a,b)=>a.at.localeCompare(b.at));
  let lo = Math.min(z.min, ...pts.map(p=>p.value)) - 2, hi = Math.max(z.max, ...pts.map(p=>p.value)) + 2;
  lo = Math.floor(lo/5)*5; hi = Math.ceil(hi/5)*5; if (hi - lo < 10) hi = lo + 10;
  const x = t => padL + (new Date(t) - t0) / (t1 - t0) * (W - padL - padR);
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const step = (hi-lo) > 30 ? 10 : 5;
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const ticks = hours <= 24 ? 4 : 6;
  for (let i=0;i<=ticks;i++){ const tt = new Date(t0 + i*(t1-t0)/ticks); const lab = hours>24 ? tt.toLocaleString(undefined,{day:"2-digit",month:"short",hour:"2-digit"}) : tt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); g += `<text x="${x(tt.toISOString())}" y="${H-4}" text-anchor="${i===0?"start":i===ticks?"end":"middle"}">${lab}</text>`; }
  const band = `<rect x="${padL}" y="${y(z.max)}" width="${W-padL-padR}" height="${y(z.min)-y(z.max)}" fill="var(--ok-soft)"/><line x1="${padL}" x2="${W-padR}" y1="${y(z.max)}" y2="${y(z.max)}" stroke="var(--bad)" stroke-dasharray="4 3" stroke-width="1"/>`;
  const path = pts.map(p => `${x(p.at).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const dots = pts.map(p => `<circle cx="${x(p.at).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${p.value>z.max?3:2}" fill="${p.value>z.max?"var(--bad)":"var(--accent)"}"><title>${dt(p.at)} · ${temp(p.value)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(z.name)} temperatures, last ${hours} hours">${band}${g}${pts.length>1?`<polyline points="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`:""}${dots}${!pts.length?`<text x="${W/2}" y="${H/2}" text-anchor="middle">No readings in this period</text>`:""}</svg>`;
}

/* ----- Stock ----- */
function vStock(){
  const zs = sortBy(list("zones"), z=>z.order||0);

  const groups = {};
  rows.forEach(b => { const k = b.productId+"|"+b.form; (groups[k] = groups[k] || []).push(b); });

  return `
  <div class="card-h"><h1>Stock</h1><div class="row"><button class="btn" data-act="transfer">Move to display freezer</button><a class="btn primary" href="#receive">Receive delivery</a></div></div>

    <div class="seg" role="tablist"><button data-act="szone" data-z="" class="${!draft.stockZone?"on":""}">All zones</button>${zs.map(z=>`<button data-act="szone" data-z="${z.id}" class="${draft.stockZone===z.id?"on":""}">${h(z.name)}</button>`).join("")}</div>

      ${bs.map((b,i) => `<tr class="${i===0?"first":""}"><td class="mono">${h(b.lot)}${i===0?` <span class="pill info">next out</span>`:""}${b.example?` <span class="pill">example</span>`:""}</td><td>${h(zone(b.zoneId).name)}${b.location?` · ${h(b.location)}`:""}</td><td>${dOnly(b.receivedAt)}</td><td>${expiryPill(b)}</td><td>${h(b.supplier||"")}</td><td class="r num">${num(b.qty,0)} / ${num(b.qtyIn,0)}</td><td class="r"><button class="btn sm" data-act="writeoff" data-id="${b.id}">Write off</button></td></tr>`).join("")}
      </tbody></table></div></div>`; }).join("") : `<div class="card"><div class="empty"><p>No stock matches. Receive a delivery to add batches.</p></div></div>`}
  <div class="card"><div class="card-h"><h2>Recent stock movements</h2></div>${movesTable(25)}</div>`;
}
function movesTable(n){
  const ms = list("moves").sort((a,b)=>b.at.localeCompare(a.at)).slice(0,n);
  const kind = { receive:["Received","ok"], sale:["Sold","info"], fraction:["Repacked","info"], transfer:["Moved",""], writeoff:["Written off","bad"] };
  return ms.length ? `<div class="tw"><table><thead><tr><th>When</th><th>Type</th><th>Details</th></tr></thead><tbody>${ms.map(m => { const k = kind[m.type]||[m.type,""]; return `<tr><td class="num">${dt(m.at)}</td><td><span class="pill ${k[1]}">${k[0]}</span></td><td>${h(m.summary)}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted">Nothing yet.</p>`;
}

/* ----- Repack (fractioning) ----- */
function vFraction(){
  const prods = sortBy(list("products").filter(p=>p.packKg>0), p=>p.name);
  const walk = list("zones").filter(z=>z.type==="walkin"), disp = sortBy(list("zones").filter(z=>z.type!=="prep"), z=>z.type==="display"?0:1);
  if (!prods.length) return `<h1>Repack cartons into retail packs</h1>` + emptyState("Add a product with a retail pack size (for example 1 kg or 500 g) in Setup.");
  const f = draft.fraction;
  const st = settings();
  const recent = list("moves").filter(m=>m.type==="fraction").sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8);
  let body;
  if (!f){
    body = `<form class="card" data-form="fstart">

  } else {
    const p = product(f.productId); const inKg = f.cartons * p.cartonKg; const maxPacks = Math.floor(inKg / p.packKg + 1e-9);
    body = `<form class="card" data-form="ffinish">
      <div class="card-h"><h2>2. Repacking ${num(f.cartons,0)} × ${h(p.name)}</h2><button type="button" class="btn sm" data-act="fcancel">Cancel</button></div>
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div><div class="small muted">Time out of the cold</div><div class="timer" id="ftimer">0:00</div></div>
        <div class="small muted">Lots: ${f.alloc.map(a=>h(a.lot)).join(", ")}<br>${num(inKg,1)} kg taken out</div>
      </div>
      <div class="fields">
        <label>Packs made (${num(p.packKg*1000,0)} g)<input id="frPacks" type="number" min="0" step="1" value="${maxPacks}" required><span class="hint">Up to ${maxPacks} packs from ${num(inKg,1)} kg.</span></label>

}
function labelHtml(p, lot, expiry){
  const packed = dOnly(nowIso());
  return `<div class="label-card"><b>${h(p.name)}</b><span class="mono">Net weight ${num(p.packKg*1000,0)} g</span><span>Lot <span class="mono">${h(lot||"")}</span> · Packed ${packed}</span><span>Best before <b class="mono" style="font-size:12px">${dOnly(expiry)}</b></span><span>Keep frozen at −18 °C or below. Do not refreeze once thawed.</span>${settings().business?`<span class="muted">${h(settings().business)}</span>`:""}</div>`;

/* ----- Sell ----- */
function newSale(channel){ return { channel, customer:"", payment:"cash", lines:[{ productId:(sortBy(list("products"),p=>p.name)[0]||{}).id||"", form: channel==="wholesale"?"carton":"pack", qty:1, price:null }] }; }
function linePrice(l, channel){ const p = product(l.productId); if (l.price!=null && l.price!=="") return Number(l.price); return l.form==="carton" ? (channel==="wholesale" ? (p.wholesalePrice||0) : (p.cartonRetailPrice || p.wholesalePrice || 0)) : (p.retailPrice||0); }
function saleSource(channel, form){
  // retail packs come from display freezers; wholesale cartons from the walk-in. Falls back to anywhere.
  const pref = form==="pack" ? zonesOf("display") : zonesOf("walkin");
  return pref.length ? pref : null;
}
function vSell(){
  const prods = sortBy(list("products"), p=>p.name);
  if (!prods.length) return `<h1>New sale</h1>` + emptyState("Add your products and prices in Setup before selling.");
  if (!draft.sale || draft.sale.channel !== draft.saleChannel) draft.sale = newSale(draft.saleChannel);
  const s = draft.sale;
  let total = 0;
  const lines = s.lines.map((l,i) => {
    const p = product(l.productId); const price = linePrice(l, s.channel); const sub = price * (Number(l.qty)||0); total += sub;
    const src = saleSource(s.channel, l.form); const avail = stockQty(l.productId, l.form, src);
    const short = (Number(l.qty)||0) > avail;
    return `<div class="line" data-line="${i}">
      <label>Product<select data-lf="productId">${prods.map(x=>`<option value="${x.id}" ${x.id===l.productId?"selected":""}>${h(x.name)}</option>`).join("")}</select></label>
      <label>Unit<select data-lf="form"><option value="carton" ${l.form==="carton"?"selected":""}>Carton ${num(p.cartonKg)} kg</option>${p.packKg?`<option value="pack" ${l.form==="pack"?"selected":""}>Pack ${num(p.packKg*1000,0)} g</option>`:""}</select></label>
      <label>Qty<input data-lf="qty" type="number" min="1" step="1" value="${h(l.qty)}"></label>
      <label>Unit price<input data-lf="price" type="number" min="0" step="any" value="${h(l.price ?? "")}" placeholder="${price}"></label>
      <label>Line total<span class="num" style="padding:8px 0">${money(sub)}</span><span class="hint ${short?"bad":""}">${num(avail,0)} in stock${short?" · not enough":""}</span></label>
      <button type="button" class="btn sm rm" data-act="rmline" data-i="${i}" aria-label="Remove line" ${s.lines.length<2?"disabled":""}>✕</button>
    </div>`; }).join("");
  const recent = list("sales").sort((a,b)=>b.at.localeCompare(a.at)).slice(0,12);
  return `<div class="card-h"><h1>New sale</h1>
    <div class="seg"><button data-act="channel" data-c="wholesale" class="${s.channel==="wholesale"?"on":""}">Wholesale</button><button data-act="channel" data-c="retail" class="${s.channel==="retail"?"on":""}">Retail</button></div></div>
  <p class="lead">${s.channel==="wholesale" ? "Wholesale sells whole cartons at the wholesale price, taken from the walk-in freezer, oldest batch first." : "Retail sells packs from the display freezers so the walk-in door stays shut. Whole cartons can also be sold at the retail carton price."}</p>
  <form class="card" data-form="sale">
    <div class="fields">
      <label>${s.channel==="wholesale"?"Customer (shop, restaurant, reseller)":"Customer (optional)"}<input id="slCustomer" value="${h(s.customer)}" ${s.channel==="wholesale"?"required":""} list="customers"></label>
      <label>Payment<select id="slPay">${["cash","mobile money","card","bank transfer","credit (pay later)"].map(x=>`<option ${s.payment===x?"selected":""}>${x}</option>`).join("")}</select></label>
    </div>
    <datalist id="customers">${[...new Set(list("sales").map(x=>x.customer).filter(Boolean))].map(c=>`<option value="${h(c)}">`).join("")}</datalist>
    <div class="lines">${lines}</div>
    <div class="row" style="justify-content:space-between"><button type="button" class="btn sm" data-act="addline">Add line</button><div class="row"><span class="muted">Total</span><span class="total">${money(total)}</span></div></div>
    <div class="row end"><button class="btn primary" type="submit">Record sale</button></div>
  </form>
  <div class="card"><div class="card-h"><h2>Recent sales</h2></div>${recent.length ? `<div class="tw"><table><thead><tr><th>When</th><th>Channel</th><th>Customer</th><th>Items</th><th class="r">Total</th><th></th></tr></thead><tbody>${recent.map(x=>`<tr><td class="num">${dt(x.at)}</td><td><span class="pill ${x.channel==="wholesale"?"info":""}">${x.channel}</span></td><td>${h(x.customer||"–")}</td><td>${x.lines.map(l=>`${num(l.qty,0)} ${formName(l.form,l.qty)} ${h(product(l.productId).name)}`).join(", ")}</td><td class="r num">${money(x.total)}</td><td class="r"><button class="btn sm" data-act="receipt" data-id="${x.id}">Receipt</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">No sales yet.</p>`}</div>`;
}

/* ----- Temperatures ----- */
function vTemps(){
  const zs = sortBy(list("zones"), z=>z.order||0);
  if (!zs.length) return `<h1>Temperatures</h1>` + emptyState("Add your walk-in freezer and display freezers in Setup, with their temperature limits.");
  if (!draft.tempZone || !S.zones[draft.tempZone]) draft.tempZone = zs[0].id;
  const z = zone(draft.tempZone);
  const log = list("temps").filter(t=>t.zoneId===z.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,24);
  const vals = list("temps").filter(t=>t.zoneId===z.id && new Date(t.at) > Date.now()-86400000).map(t=>t.value);
  return `<h1>Temperatures</h1>
  <p class="lead">Record each zone's display reading (or connected logger value) at least every ${settings().staleHours} hours. This log is your proof of the cold chain during inspections.</p>
  <form class="card" data-form="temps">
    <div class="card-h"><h2>Log a round of readings</h2><p>${new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}</p></div>
    <div class="fields">${zs.map(z => { const t = latestTemp(z.id); return `<label>${h(z.name)} <span class="hint">limit ${temp(z.max)} · last ${t?temp(t.value):"–"}</span><input id="tp_${z.id}" type="number" step="0.1" placeholder="°C"></label>`; }).join("")}
    <label>Read by<input id="tpBy" placeholder="Name"></label></div>
    <div class="row end"><button class="btn primary" type="submit">Save readings</button></div>
  </form>
  <div class="card">
    <div class="card-h"><div class="seg">${zs.map(x=>`<button data-act="tzone" data-z="${x.id}" class="${x.id===z.id?"on":""}">${h(x.name)}</button>`).join("")}</div>
    <p>Allowed ${temp(z.min)} to ${temp(z.max)}${vals.length?` · 24 h min ${temp(Math.min(...vals))}, max ${temp(Math.max(...vals))}`:""}</p></div>
    <div class="chart">${tempChart(z, 72, 220)}</div>
    <div class="tw"><table><thead><tr><th>When</th><th class="r">Reading</th><th class="r">°F</th><th>Status</th><th>By</th><th></th></tr></thead><tbody>
    ${log.map(t=>`<tr><td class="num">${dt(t.at)}</td><td class="r num">${temp(t.value)}</td><td class="r num muted">${toF(t.value).toFixed(1)}</td><td>${t.value>z.max?`<span class="pill bad">above limit</span>`:t.value<z.min?`<span class="pill info">below range</span>`:`<span class="pill ok">ok</span>`}</td><td>${h(t.by||"")}</td><td class="r"><button class="btn sm" data-act="deltemp" data-id="${t.id}" aria-label="Delete reading">✕</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No readings for this zone yet.</td></tr>`}
    </tbody></table></div>
  </div>
  ${checksCard()}`;
}
const CHECKS = [
  ["door","Door seals and strip curtain intact, door closes by itself"],
  ["evap","Evaporator coil free of heavy ice, fans running"],
  ["condenser","Condensing unit outside is clean and not blocked"],
  ["generator","Generator or UPS tested, fuel above half"],
  ["ppe","Insulated jackets, gloves and anti-slip boots available for staff"],
  ["floor","Floor dry and not icy, aisles clear"],
  ["alarm","Temperature alarm tested"]
];
function checksCard(){
  const k = dayKey(new Date()); const c = S.checks[k] || { id:k, items:{} };
  const done = CHECKS.filter(x=>c.items[x[0]]).length;
  return `<div class="card"><div class="card-h"><h2>Daily safety checks</h2><p>${done}/${CHECKS.length} done today</p></div>
  <div class="checklist">${CHECKS.map(([id,txt])=>`<label class="check"><input type="checkbox" data-act="check" data-k="${id}" ${c.items[id]?"checked":""}> ${h(txt)}</label>`).join("")}</div></div>`;
}

/* ----- Power & defrost events ----- */
const EVENT_KINDS = { power:"Power cut", generator:"Generator test or run", defrost:"Defrost cycle", door:"Door left open", breakdown:"Breakdown / repair", cleaning:"Cleaning", other:"Other" };
function vEvents(){
  const open = openEvents(), st = settings();
  const past = list("events").filter(e=>e.end).sort((a,b)=>b.start.localeCompare(a.start)).slice(0,30);
  return `<h1>Power &amp; defrost</h1>
  <p class="lead">A power cut of a few hours can ruin the whole stock. Record outages, generator runs, defrost cycles and breakdowns as they happen, so you know exactly how long the room was without cooling.</p>
  <div class="grid g2">
  <form class="card" data-form="event">
    <div class="card-h"><h2>Start an event</h2></div>
    <div class="fields">
      <label>Type<select id="evKind">${Object.entries(EVENT_KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
      <label>Started<input id="evStart" type="datetime-local" value="${localInput(new Date())}"></label>
      <label>Zone<select id="evZone"><option value="">Whole cold room</option>${sortBy(list("zones"),z=>z.order||0).map(z=>`<option value="${z.id}">${h(z.name)}</option>`).join("")}</select></label>
      <label>Note<input id="evNote" placeholder="e.g. grid cut, compressor tripped"></label>
    </div>
    <label class="check"><input type="checkbox" id="evGen"> Backup generator or UPS is running</label>
    <div class="row end"><button class="btn primary" type="submit">Start</button></div>
  </form>
  <div class="card"><div class="card-h"><h2>In progress</h2></div>
    ${open.length ? open.map(e => `<div class="alert ${e.kind==="power"&&!e.generator||e.kind==="breakdown"?"bad":"warn"}"><div style="flex:1"><b>${EVENT_KINDS[e.kind]||e.kind}${e.zoneId?` · ${h(zone(e.zoneId).name)}`:""}</b>
      <span class="small">Since ${dt(e.start)} · <span class="mono" data-since="${e.start}">${dur(Date.now()-new Date(e.start))}</span>${e.generator?" · on backup power":""}${e.note?` · ${h(e.note)}`:""}</span></div>
      <div class="row">${e.kind==="power"&&!e.generator?`<button class="btn sm" data-act="evgen" data-id="${e.id}">Generator on</button>`:""}<button class="btn sm primary" data-act="evend" data-id="${e.id}">End now</button></div></div>`).join("") : `<p class="muted">Nothing in progress. Cooling is running normally.</p>`}
  </div></div>
  <div class="card"><div class="card-h"><h2>History</h2><p>${(() => { const since = Date.now()-30*86400000; const cuts = list("events").filter(e=>e.kind==="power"&&e.end&&new Date(e.start)>since); const ms = cuts.reduce((s,e)=>s+(new Date(e.end)-new Date(e.start)),0); return `${cuts.length} power cut${cuts.length===1?"":"s"} in 30 days, ${dur(ms)} in total`; })()}</p></div>
  ${past.length ? `<div class="tw"><table><thead><tr><th>Type</th><th>Start</th><th class="r">Duration</th><th>Backup</th><th>Peak temp</th><th>Note</th></tr></thead><tbody>${past.map(e=>{ const ms = new Date(e.end)-new Date(e.start); const peak = peakDuring(e); const risky = e.kind==="power" && !e.generator && ms/3600000 >= st.maxOutageHours/2;
    return `<tr><td>${EVENT_KINDS[e.kind]||e.kind}${e.zoneId?` · ${h(zone(e.zoneId).name)}`:""}</td><td class="num">${dt(e.start)}</td><td class="r num">${risky?`<span class="pill bad">${dur(ms)}</span>`:dur(ms)}</td><td>${e.kind==="power"?(e.generator?"yes":"no"):"–"}</td><td class="num">${peak!=null?temp(peak):"–"}</td><td>${h(e.note||"")}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted">No events recorded yet.</p>`}</div>`;
}
function peakDuring(e){
  const a = new Date(e.start), b = new Date(new Date(e.end).getTime()+2*3600000);
  const ts = list("temps").filter(t => (!e.zoneId || t.zoneId===e.zoneId) && zone(t.zoneId).type!=="prep" && new Date(t.at)>=a && new Date(t.at)<=b).map(t=>t.value);
  return ts.length ? Math.max(...ts) : null;
}

/* ---------- toast & tick ---------- */
let toastT = null;
function toast(msg){ let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3600); }
function tick(){
  const f = draft.fraction, el = $("#ftimer");
  if (f && el){ const s = Math.floor((Date.now()-new Date(f.startedAt))/1000); el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; const st = settings(); el.className = "timer" + (s/60 > st.fractionMaxMin ? " bad" : s/60 > st.fractionWarnMin ? " warn" : ""); }
  $$("[data-since]").forEach(e => e.textContent = dur(Date.now()-new Date(e.dataset.since)));
}
function afterRender(v){
  tick();
  if (v === "receive"){ const t = $("#rcTemp"); if (t) t.dispatchEvent(new Event("input",{bubbles:true})); }
}

/* ---------- actions ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const nval = id => { const v = val(id); return v === "" ? null : Number(v); };

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "stockQ"){ draft.stockQ = t.value; const pos = t.selectionStart; render(); const n = $("#stockQ"); n.focus(); try { n.setSelectionRange(pos,pos); } catch(_){} return; }
  if (t.id === "rcTemp"){
    const v = t.value === "" ? null : Number(t.value); const hEl = $("#rcTempHint"); if (!hEl) return;
    if (v == null){ hEl.className = "hint"; hEl.textContent = "Probe between two cartons in the middle of the load."; }
    else if (v > -12){ hEl.className = "hint bad"; hEl.textContent = "Refuse this lot: the product has started to thaw."; }
    else if (v > -15){ hEl.className = "hint bad"; hEl.textContent = "Above −15 °C. Refuse, or accept only with the supplier's written agreement."; }
    else if (v > -18){ hEl.className = "hint warn"; hEl.textContent = "Within transport tolerance. Get it into the walk-in immediately."; }
    else { hEl.className = "hint ok"; hEl.textContent = "Good: −18 °C or colder."; }
  }
  const line = t.closest && t.closest("[data-line]");
  if (line && draft.sale){
    const i = +line.dataset.line, f = t.dataset.lf, l = draft.sale.lines[i];
    if (f === "qty") l.qty = t.value === "" ? "" : Number(t.value);
    if (f === "price") l.price = t.value === "" ? null : Number(t.value);
    if (f === "productId"){ l.productId = t.value; l.price = null; if (!product(t.value).packKg) l.form = "carton"; }
    if (f === "form"){ l.form = t.value; l.price = null; }
    if (f !== "qty" && f !== "price") render(); else refreshSaleTotals();
  }
  if (t.id === "slCustomer" && draft.sale) draft.sale.customer = t.value;
  if (t.id === "slPay" && draft.sale) draft.sale.payment = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.closest && t.closest("[data-line]") && t.tagName === "SELECT") return; // handled by input
  if (t.dataset.act === "check"){ const k = dayKey(new Date()); const c = S.checks[k] ? JSON.parse(JSON.stringify(S.checks[k])) : { id:k, items:{} }; c.items[t.dataset.k] = t.checked ? nowIso() : null; if (!t.checked) delete c.items[t.dataset.k]; put("checks", c); render(); }
  if (t.id === "importFile" && t.files[0]){ const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d || typeof d !== "object" || !d.products) throw 0; importAll(d); } catch(_){ toast("That file is not a Chambre Froide backup."); } }; r.readAsText(t.files[0]); }
});
function refreshSaleTotals(){
  // light update without re-rendering the inputs being typed in
  const s = draft.sale; let total = 0;
  $$("[data-line]").forEach(el => { const l = s.lines[+el.dataset.line]; const price = linePrice(l, s.channel); const sub = price*(Number(l.qty)||0); total += sub;
    const lab = el.querySelectorAll("label")[4]; const avail = stockQty(l.productId, l.form, saleSource(s.channel,l.form)); const short = (Number(l.qty)||0) > avail;
    lab.querySelector(".num").innerHTML = money(sub); const hn = lab.querySelector(".hint"); hn.className = "hint" + (short?" bad":""); hn.textContent = `${num(avail,0)} in stock${short?" · not enough":""}`; });
  const tt = $(".total"); if (tt) tt.innerHTML = money(total);
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "mclose"){ if (e.target === a || a.tagName === "BUTTON") closeModal(); return; }
  if (a.tagName === "INPUT") return;
  e.preventDefault();
  const id = a.dataset.id;
  switch(act){
    case "demo": loadDemo(); break;
    case "szone": draft.stockZone = a.dataset.z; render(); break;
    case "tzone": draft.tempZone = a.dataset.z; render(); break;
    case "channel": draft.saleChannel = a.dataset.c; render(); break;
    case "addline": { const p = sortBy(list("products"),p=>p.name)[0]; draft.sale.lines.push({ productId:p.id, form: draft.sale.channel==="wholesale"||!p.packKg?"carton":"pack", qty:1, price:null }); render(); break; }
    case "rmline": draft.sale.lines.splice(+a.dataset.i,1); render(); break;
    case "receipt": receiptModal(id); break;
    case "writeoff": writeoffModal(id); break;
    case "transfer": if (!list("products").length) toast("Add products first."); else transferModal(); break;
    case "editprod": prodModal(id); break;
    case "editzone": zoneModal(id); break;
    case "delprod": closeModal(); confirmModal("Delete product", `Delete ${product(id).name}? Its batches and sales history stay, shown as a deleted product.`, "delprod:"+id); break;
    case "delzone": closeModal(); confirmModal("Delete zone", `Delete ${zone(id).name}? Its temperature readings stay in the log.`, "delzone:"+id); break;
    case "deltemp": del("temps", id); render(); toast("Reading deleted"); break;
    case "fcancel": if (draft.fraction){
      // put the unopened cartons back into the batches they came from
      const f = draft.fraction;
      f.alloc.forEach(x => { const b = S.batches[x.batchId]; if (b) put("batches", Object.assign({}, b, { qty: b.qty + x.qty })); });
      logMove("transfer", `${f.cartons} cartons ${product(f.productId).name} returned unopened to the walk-in`, {});
      draft.fraction = null; render(); toast("Cartons returned to stock");
    } break;
    case "evend": { const ev = Object.assign({}, S.events[id], { end: nowIso() }); put("events", ev); render(); toast(`${EVENT_KINDS[ev.kind]} ended after ${dur(new Date(ev.end)-new Date(ev.start))}`); break; }
    case "evgen": put("events", Object.assign({}, S.events[id], { generator:true, note: (S.events[id].note? S.events[id].note+"; ":"") + "generator started " + new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) })); render(); break;
    case "export": exportAll(); break;
    case "clearex": confirmModal("Delete example data", "Remove every record marked as an example (products, zones, stock, sales, readings and events)? Your own records stay.", "clearex"); break;
    case "wipe": confirmModal("Delete everything", "This removes every product, zone, batch, sale, temperature reading and event. Export a backup first if you may need them.", "wipe", "DELETE"); break;
  }
});

document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const kind = f.dataset.form;
  try { (FORMS[kind])(f); } catch(err){ toast(err.message || String(err)); }
});

const FORMS = {
  receive(){
    const p = product(val("rcProduct")), qty = nval("rcQty"), at = new Date(val("rcDate")+"T"+new Date().toTimeString().slice(0,8)).toISOString();
    if (!(qty > 0)) throw new Error("Enter how many cartons arrived.");
    const tArr = nval("rcTemp");
    if (tArr != null && tArr > -12) throw new Error("Product above −12 °C has started to thaw. Refuse the lot instead of storing it.");
    const b = { id:uid("bt"), productId:val("rcProduct"), zoneId:val("rcZone"), form:"carton", unitKg:p.cartonKg, qty, qtyIn:qty, lot:val("rcLot"), receivedAt:at, expiry:val("rcExp"), productionDate:val("rcProd"), location:val("rcLoc"), supplier:val("rcSupplier"), unitCost:nval("rcCost"), arrivalTemp:tArr, truckTemp:nval("rcTruck"), packagingOk:$("#rcPack").checked };
    put("batches", b);
    logMove("receive", `${qty} cartons ${p.name} (${num(qty*p.cartonKg,1)} kg), lot ${b.lot}${b.supplier?`, from ${b.supplier}`:""} → ${zone(b.zoneId).name}`, { batchId:b.id, arrivalTemp:tArr });
    toast(`${qty} cartons of ${p.name} added to stock`);
    $$("#main form input").forEach(i => { if (i.type!=="date" && i.type!=="checkbox") i.value = ""; }); lastView = null; render();
  },
  fstart(){
    const pid = val("frProduct"), n = nval("frCartons");
    const walk = zonesOf("walkin");
    const alloc = fifoPick(pid, "carton", walk.length?walk:null, n);
    if (!alloc) throw new Error(`Only ${stockQty(pid,"carton",walk.length?walk:null)} cartons of ${product(pid).name} in the walk-in.`);
    const exp = alloc.map(a=>S.batches[a.batchId].expiry).filter(Boolean).sort()[0] || "";
    const rec = alloc.map(a=>S.batches[a.batchId].receivedAt).sort()[0];
    applyAlloc(alloc);
    draft.fraction = { productId:pid, cartons:n, alloc, startedAt:nowIso(), expiry:exp, receivedAt:rec };
    logMove("transfer", `${n} cartons ${product(pid).name} taken to the repacking room (lot ${alloc.map(a=>a.lot).join(", ")})`, { alloc });
    lastView = null; render();
  },
  ffinish(){
    const f = draft.fraction, p = product(f.productId); const packs = nval("frPacks"); const inKg = f.cartons*p.cartonKg;
    if (packs == null || packs < 0) throw new Error("Enter how many packs were made.");
    if (packs*p.packKg > inKg + 1e-6) throw new Error(`${packs} packs would weigh ${num(packs*p.packKg,1)} kg, more than the ${num(inKg,1)} kg taken out.`);
    const minutes = (Date.now()-new Date(f.startedAt))/60000; const loss = inKg - packs*p.packKg;
    const lots = [...new Set(f.alloc.map(a=>a.lot))].join("+");
    if (packs > 0) put("batches", { id:uid("bt"), productId:f.productId, zoneId:val("frZone"), form:"pack", unitKg:p.packKg, qty:packs, qtyIn:packs, lot:lots, receivedAt:f.receivedAt, expiry:f.expiry, packedAt:nowIso(), sourceBatches:f.alloc.map(a=>a.batchId), supplier:"Repacked" });
    logMove("fraction", `${f.cartons} cartons ${p.name} → ${packs} × ${num(p.packKg*1000,0)} g packs in ${zone(val("frZone")).name}; ${num(loss,2)} kg trim/loss${val("frBy")?`; by ${val("frBy")}`:""}`, { minutes:+minutes.toFixed(1), lossKg:+loss.toFixed(3), endTemp:nval("frTemp") });
    draft.fraction = null;
    toast(minutes > settings().fractionMaxMin ? `Recorded. ${Math.round(minutes)} min out of the cold is over the limit: check the packs are still hard-frozen.` : `${packs} packs stored. Out of the cold for ${Math.round(minutes)} min.`);
    lastView = null; render();
  },
  sale(){
    const s = draft.sale; s.customer = val("slCustomer"); s.payment = val("slPay");
    if (s.channel === "wholesale" && !s.customer) throw new Error("Enter the wholesale customer's name.");
    // allocate every line first so nothing is taken if one line is short
    const need = {};
    s.lines.forEach(l => { if (!(l.qty > 0)) throw new Error("Every line needs a quantity."); const k = l.productId+"|"+l.form; need[k] = (need[k]||0) + l.qty; });
    for (const [k,q] of Object.entries(need)){ const [pid,form] = k.split("|"); const src = saleSource(s.channel, form); if (stockQty(pid,form,src) < q){ const anywhere = stockQty(pid,form); throw new Error(`Not enough ${product(pid).name} ${formName(form)}: ${stockQty(pid,form,src)} available${anywhere>stockQty(pid,form,src)?` here, ${anywhere} in other zones (move them first)`:""}.`); } }
    const lines = s.lines.map(l => { const alloc = fifoPick(l.productId, l.form, saleSource(s.channel,l.form), l.qty); applyAlloc(alloc); return { productId:l.productId, form:l.form, qty:l.qty, unitPrice:linePrice(l,s.channel), alloc }; });
    const total = lines.reduce((a,l)=>a+l.qty*l.unitPrice,0);
    const sale = { id:uid("sl"), at:nowIso(), channel:s.channel, customer:s.customer, payment:s.payment, lines, total };
    put("sales", sale);
    logMove("sale", `${s.channel === "wholesale" ? "Wholesale" : "Retail"}${s.customer?` to ${s.customer}`:""}: ${lines.map(l=>`${l.qty} ${formName(l.form,l.qty)} ${product(l.productId).name}`).join(", ")} (${money(total).replace(/<[^>]+>/g,"")})`, { saleId:sale.id });
    draft.sale = null; lastView = null; render(); receiptModal(sale.id);
  },
  temps(){
    let n = 0; const by = val("tpBy"), at = nowIso();
    list("zones").forEach(z => { const v = nval("tp_"+z.id); if (v != null){ put("temps", { id:uid("tp"), zoneId:z.id, value:v, at, by }); n++; } });
    if (!n) throw new Error("Enter at least one reading.");
    const bad = list("zones").filter(z => { const v = nval("tp_"+z.id); return v != null && v > z.max; });
    lastView = null; render();
    toast(bad.length ? `Saved. Alarm: ${bad.map(z=>z.name).join(", ")} above limit.` : `${n} reading${n>1?"s":""} saved`);
  },
  event(){
    const ev = { id:uid("ev"), kind:val("evKind"), start:new Date(val("evStart")).toISOString(), end:null, zoneId:val("evZone"), note:val("evNote"), generator:$("#evGen").checked };
    put("events", ev); lastView = null; render(); toast(`${EVENT_KINDS[ev.kind]} started`);
  },
  settings(){
    put("settings", Object.assign({}, S.settings.main||{}, { id:"main", business:val("stBiz"), currency:val("stCur"), staleHours:nval("stStale")||4, expiryWarnDays:nval("stExp")||30, fractionWarnMin:nval("stFw")||15, fractionMaxMin:nval("stFm")||30, maxOutageHours:nval("stOut")||4 }));
    render(); toast("Rules saved");
  },
  product(f){
    const id = f.dataset.id || uid("pr"); const old = S.products[id] || {};
    put("products", Object.assign({}, old, { id, name:val("pName"), category:val("pCat"), cartonKg:nval("pCkg")||0, wholesalePrice:nval("pWp")||0, packKg:nval("pPkg")||0, retailPrice:nval("pRp")||0, minCartons:nval("pMin")||0 }));
    closeModal(); render(); toast("Product saved");
  },
  zone(f){
    const id = f.dataset.id || uid("zn"); const old = S.zones[id] || { order: list("zones").length };
    const mn = nval("zMin"), mx = nval("zMax"); if (mn >= mx) throw new Error("The coldest allowed temperature must be below the warmest.");
    put("zones", Object.assign({}, old, { id, name:val("zName"), type:val("zType"), setpoint:nval("zSet"), min:mn, max:mx }));
    closeModal(); render(); toast("Zone saved");
  },
  writeoff(f){
    const b = S.batches[f.dataset.id]; const q = nval("woQty"); if (!(q>0) || q > b.qty) throw new Error(`Enter a quantity between 1 and ${b.qty}.`);
    put("batches", Object.assign({}, b, { qty: b.qty - q }));
    logMove("writeoff", `${q} ${formName(b.form,q)} ${product(b.productId).name}, lot ${b.lot}: ${val("woWhy")}`, { batchId:b.id, qty:q, kg:q*b.unitKg });
    closeModal(); render(); toast("Written off");
  },
  transfer(){
    const pid = val("trProduct"), form = val("trForm"), q = nval("trQty"), from = val("trFrom"), to = val("trTo");
    if (from === to) throw new Error("Pick two different zones.");
    const alloc = fifoPick(pid, form, [from], q); if (!alloc) throw new Error(`Only ${stockQty(pid,form,[from])} ${formName(form)} of ${product(pid).name} in ${zone(from).name}.`);
    applyAlloc(alloc);
    alloc.forEach(a => { const src = S.batches[a.batchId]; put("batches", Object.assign({}, src, { id:uid("bt"), zoneId:to, qty:a.qty, qtyIn:a.qty, location:"", movedFrom:src.id })); });
    logMove("transfer", `${q} ${formName(form,q)} ${product(pid).name}: ${zone(from).name} → ${zone(to).name}`, { alloc });
    closeModal(); render(); toast("Moved");
  },
  confirm(f){
    const w = f.querySelector("[data-word]").dataset.word; if (w && val("cfWord") !== w) throw new Error(`Type ${w} to confirm.`);
    const [what, id] = f.dataset.do.split(":");
    if (what === "delprod") del("products", id);
    if (what === "delzone") del("zones", id);
    if (what === "clearex") COLS.forEach(c => list(c).filter(d => d.example).forEach(d => del(c, d.id)));
    if (what === "wipe") COLS.forEach(c => list(c).forEach(d => del(c, d.id)));
    closeModal(); render(); toast("Deleted");
  }
};

/* ---------- backup ---------- */
async function exportAll(){
  const data = JSON.stringify(Object.assign({ app:"chambre-froide", version:1, exportedAt:nowIso() }, S), null, 1);
  const filename = `chambre-froide-backup-${dayKey(new Date())}.json`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch(_){}
  if (dl){ try { await dl.save({ filename, data }); toast("Backup saved"); } catch(_){ toast("Backup not saved."); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
function importAll(d){
  COLS.forEach(c => list(c).forEach(x => { if (!d[c] || !d[c][x.id]) del(c, x.id); }));
  COLS.forEach(c => Object.values(d[c] || {}).forEach(x => put(c, x)));
  render(); toast("Backup restored");
}

    { id:"pr_ice", name:"Vanilla ice cream 2 L", category:"Ice cream", cartonKg:12, wholesalePrice:21000, packKg:0, retailPrice:0, minCartons:4 }

  const B = (id, pid, zid, form, unitKg, qty, qtyIn, lot, ageDays, expDays, supplier, location) => Object.assign({ id, productId:pid, zoneId:zid, form, unitKg, qty, qtyIn, lot, receivedAt:iso(now-ageDays*D), expiry:day(now+expDays*D), supplier, location }, ex);
  const batches = [
    B("bt_c1","pr_chick","zn_walkin","carton",10,12,60,"CQ-2409-118",34,240,"Atlantic Poultry Import","Rack A1"),
    B("bt_c2","pr_chick","zn_walkin","carton",10,80,80,"CQ-2410-042",9,300,"Atlantic Poultry Import","Rack A2"),
    B("bt_w1","pr_wings","zn_walkin","carton",10,22,40,"CW-2410-007",15,280,"Atlantic Poultry Import","Rack A3"),
    B("bt_m1","pr_mack","zn_walkin","carton",20,4,30,"MK-0811",62,21,"Port fish market","Rack B1"),
    B("bt_m2","pr_mack","zn_walkin","carton",20,45,45,"MK-1027",6,170,"Port fish market","Rack B2"),
    B("bt_t1","pr_tilap","zn_walkin","carton",10,8,20,"TL-551",40,120,"Lake Farms","Rack B3"),
    B("bt_b1","pr_beef","zn_walkin","carton",25,5,12,"BF-3390",20,150,"Central abattoir","Rack C1"),
    B("bt_v1","pr_veg","zn_walkin","carton",10,14,25,"VG-2207",55,330,"FreshFrost Ltd","Rack C2"),
    B("bt_i1","pr_ice","zn_walkin","carton",12,3,10,"IC-7781",45,-2,"Dairy Co.","Rack D1"),
    B("bt_i2","pr_ice","zn_walkin","carton",12,9,9,"IC-7920",12,160,"Dairy Co.","Rack D1"),
    B("bt_pc","pr_chick","zn_disp1","pack",1,34,60,"CQ-2409-118",34,240,"Repacked",""),
    B("bt_pw","pr_wings","zn_disp1","pack",1,18,30,"CW-2410-007",15,280,"Repacked",""),
    B("bt_pm","pr_mack","zn_disp2","pack",1,26,40,"MK-0811",62,21,"Repacked",""),
    B("bt_pt","pr_tilap","zn_disp2","pack",0.5,12,40,"TL-551",40,120,"Repacked",""),
    B("bt_pv","pr_veg","zn_disp2","pack",0.5,30,40,"VG-2207",55,330,"Repacked","")
  ];
  const temps = [];
  zones.forEach(z => {
    for (let t = now - 72*H; t <= now - 20*60000; t += 2*H){
      let v = z.setpoint + (rnd()-0.5)*1.6;
      const hAgo = (now - t)/H;
      if (z.type!=="prep" && Math.abs(hAgo-30) < 1.1) v = z.setpoint + 3.5;     // defrost spike
      if (z.id!=="zn_prep" && hAgo > 49 && hAgo < 54) v = z.setpoint + 2 + (54-hAgo)*0.4; // power cut drift
      temps.push(Object.assign({ id:`tp_${z.id}_${Math.round(t/60000)}`, zoneId:z.id, value:+v.toFixed(1), at:iso(t), by: hAgo%24 < 12 ? "Awa" : "Kofi" }, ex));
    }
    // latest round, 15 minutes ago: display freezer 2 lid left open, so it shows a live alarm
    const last = z.id==="zn_disp2" ? -16.8 : +(z.setpoint + (rnd()-0.5)*1.2).toFixed(1);
    temps.push(Object.assign({ id:`tp_${z.id}_last`, zoneId:z.id, value:last, at:iso(now-15*60000), by:"Awa" }, ex));
  });
  const events = [
    { id:"ev_1", kind:"power", start:iso(now-54*H), end:iso(now-49*H-20*60000), zoneId:"", note:"Grid outage; generator failed to start for first hour", generator:true },
    { id:"ev_2", kind:"defrost", start:iso(now-30*H-15*60000), end:iso(now-29*H-50*60000), zoneId:"zn_walkin", note:"Scheduled defrost", generator:false },
    { id:"ev_3", kind:"defrost", start:iso(now-6*H-15*60000), end:iso(now-5*H-48*60000), zoneId:"zn_walkin", note:"Scheduled defrost", generator:false },
    { id:"ev_4", kind:"generator", start:iso(now-4*D), end:iso(now-4*D+20*60000), zoneId:"", note:"Weekly generator test", generator:true }
  ].map(e => Object.assign(e, ex));
  const sales = [];
  const mk = (ago, channel, customer, payment, lines) => { const total = lines.reduce((a,l)=>a+l.qty*l.unitPrice,0); sales.push(Object.assign({ id:`sl_ex${sales.length}`, at:iso(now-ago), channel, customer, payment, lines, total }, ex)); };
  const L = (pid, form, qty, price, bid, lot) => ({ productId:pid, form, qty, unitPrice:price, alloc:[{ batchId:bid, qty, lot }] });
  mk(26*H,"wholesale","Mama Ngozi Restaurant","credit (pay later)",[L("pr_chick","carton",10,16500,"bt_c1","CQ-2409-118"),L("pr_mack","carton",4,24000,"bt_m1","MK-0811")]);
  mk(22*H,"retail","","cash",[L("pr_chick","pack",3,1900,"bt_pc","CQ-2409-118")]);
  mk(5*H,"wholesale","Supermarché Étoile","bank transfer",[L("pr_chick","carton",8,16500,"bt_c1","CQ-2409-118"),L("pr_wings","carton",5,18000,"bt_w1","CW-2410-007"),L("pr_veg","carton",3,9000,"bt_v1","VG-2207")]);
  mk(3*H,"retail","","mobile money",[L("pr_mack","pack",2,1400,"bt_pm","MK-0811"),L("pr_veg","pack",2,600,"bt_pv","VG-2207")]);
  mk(2*H,"retail","","cash",[L("pr_chick","pack",2,1900,"bt_pc","CQ-2409-118"),L("pr_wings","pack",1,2100,"bt_pw","CW-2410-007")]);
  mk(70*60000,"wholesale","Hotel Lagune","cash",[L("pr_beef","carton",2,62500,"bt_b1","BF-3390"),L("pr_tilap","carton",4,19500,"bt_t1","TL-551")]);
  mk(25*60000,"retail","","cash",[L("pr_tilap","pack",4,1150,"bt_pt","TL-551")]);
  const moves = [
    { id:"mv_ex1", at:iso(now-9*D), type:"receive", summary:"80 cartons Chicken quarters (800 kg), lot CQ-2410-042, from Atlantic Poultry Import → Walk-in freezer", data:{ arrivalTemp:-20.4 } },
    { id:"mv_ex2", at:iso(now-6*D), type:"receive", summary:"45 cartons Mackerel (whole) (900 kg), lot MK-1027, from Port fish market → Walk-in freezer", data:{ arrivalTemp:-17.2 } },
    { id:"mv_ex3", at:iso(now-28*H), type:"fraction", summary:"3 cartons Chicken quarters → 30 × 1000 g packs in Display freezer 1; 0 kg trim/loss; by Awa", data:{ minutes:12 } },
    { id:"mv_ex4", at:iso(now-27*H), type:"fraction", summary:"1 cartons Tilapia → 19 × 500 g packs in Display freezer 2; 0.5 kg trim/loss; by Awa", data:{ minutes:21 } },
    { id:"mv_ex5", at:iso(now-48*H), type:"writeoff", summary:"2 packs Mackerel (whole), lot MK-0811: Thawed (cold chain break)", data:{} }
  ].map(m => Object.assign(m, ex));
  sales.forEach(s => moves.push(Object.assign({ id:"mv_"+s.id, at:s.at, type:"sale", summary:`${s.channel==="wholesale"?"Wholesale":"Retail"}${s.customer?` to ${s.customer}`:""}: ${s.lines.map(l=>`${l.qty} ${l.form==="carton"?"cartons":"packs"} ${products.find(p=>p.id===l.productId).name}`).join(", ")}`, data:{ saleId:s.id } }, ex)));
  const settingsDoc = { id:"main", business:"Example: Cold Store Express", currency:"FCFA", staleHours:4, expiryWarnDays:30, fractionWarnMin:15, fractionMaxMin:30, maxOutageHours:4 };
  return { zones, products, batches, temps, events, sales, moves, checks:[], settings:[settingsDoc] };
}
