name: Release

# Push a tag "v1.2.3" (same version as <Version> in Directory.Build.props) to build the CUSTOMER installer and attach it
# to a GitHub Release of the PUBLIC downloads repository (this source repository is private, so its own release files
# would need a GitHub login to download). The owner's LicenseManager installer is never built here.
# Needs: repository secret RELEASES_TOKEN (fine-grained token, "Contents: read and write" on the downloads repository)
# and optionally the variable RELEASES_REPO (default junelstone/stoneshotspot-releases).
# The release check refuses the development keys, so the owner's public keys must be committed first
# (docs/licensing.md → "Before the first release").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Tag matches the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props" }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Build, test, publish
        shell: pwsh
        run: ./build.ps1 -Publish

      - name: Release check (owner keys only, nothing of the owner inside)
        shell: pwsh
        run: ./tools/Test-ReleaseContent.ps1 -Path artifacts/publish

      - name: Customer installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DPublishDir=$PWD\artifacts\publish" installer\StonesHotspot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: GitHub Release (public downloads repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'junelstone/stoneshotspot-releases' }}
        run: |
          $file = "installer\Output\StonesHotspot-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $env:GH_TOKEN) { throw "Repository secret RELEASES_TOKEN is missing (see licence-server/README.md)" }
          $url = "https://github.com/$env:RELEASES_REPO/releases/download/$env:GITHUB_REF_NAME/StonesHotspot-Setup-$env:VERSION.exe"
          $notes = @"
          Stone's Hotspot $env:VERSION

          To offer this version to the hotspots, fill the row of the ``update_manifest`` table (Supabase → Table Editor):
          - version: ``$env:VERSION``
          - url: ``$url``
          - sha256: ``$hash``
          - notes: what changed (shown to the shop)
          "@
          gh release create $env:GITHUB_REF_NAME $file --repo $env:RELEASES_REPO --title "Stone's Hotspot $env:VERSION" --notes $notes
